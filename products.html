<!doctype html>
<html lang="ar" dir="rtl" class="pre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنتجات | يسر</title>
<meta name="description" content="تصفّح المجالس والكنب وغرف النوم والمطابخ والأبواب والسفرات التي ننفذها على المقاس، مع أسعار البداية ومدة التنفيذ.">
<meta name="theme-color" content="#7A5C43">
<meta property="og:type" content="website">
<meta property="og:site_name" content="يسر | Yusr">
<meta property="og:url" content="https://yasser1164-ux.github.io/yusr/products.html">
<meta property="og:image" content="https://yasser1164-ux.github.io/yusr/assets/logo.svg">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://yasser1164-ux.github.io/yusr/products.html">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
<noscript><style>html.pre main > * { visibility: visible; }</style></noscript>
</head>
<body data-page="products" data-async>
<div id="header-slot"></div>

<main id="main">
  <section class="section section--tight">
    <div class="container">
      <div class="catalog__head">
        <h1 id="catalog-title" data-i18n="products.title"></h1>
        <p id="catalog-lead" data-i18n="products.lead"></p>
      </div>

      <div class="catalog__tools">
        <div class="chips chips--scroll" id="filter-cats" role="group" data-i18n-attr="aria-label:filters.category"></div>
        <div class="chips chips--scroll catalog__tags" id="filter-tags" role="group" data-i18n-attr="aria-label:filters.subtype" hidden></div>
        <div class="chips" id="filter-active" hidden></div>

        <div class="catalog__bar">
          <label class="search-inline">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
            <span class="visually-hidden" data-i18n="filters.searchLabel"></span>
            <input type="search" id="catalog-search" autocomplete="off" data-i18n-attr="placeholder:filters.searchPh">
          </label>
          <label class="sortbox">
            <span data-i18n="sort.label"></span>
            <select id="sort"></select>
          </label>
        </div>

        <p class="catalog__count" id="catalog-count" role="status" aria-live="polite"></p>
      </div>

      <div class="grid grid--3" id="catalog-grid" data-loading>
        <p class="muted" data-i18n="common.loading"></p>
      </div>

      <div class="empty" id="catalog-empty" hidden>
        <p data-i18n="products.empty"></p>
        <div class="btn-row">
          <a class="btn btn--primary" href="custom.html"><span data-i18n="products.emptyCta"></span></a>
          <button type="button" class="btn btn--ghost" data-clear-all><span data-i18n="filters.clearAll"></span></button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-slot"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/products.js"></script>
</body>
</html>
