<!doctype html>
<html lang="ar" dir="rtl" class="pre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="واتساب وهاتف وبريد وساعات العمل والمدن التي نغطيها بالتوصيل والتركيب.">
<meta name="theme-color" content="#7A5C43">
<meta property="og:type" content="website">
<meta property="og:site_name" content="يسر | Yusr">
<meta property="og:url" content="https://yasser1164-ux.github.io/yusr/contact.html">
<meta property="og:image" content="https://yasser1164-ux.github.io/yusr/assets/logo.svg">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://yasser1164-ux.github.io/yusr/contact.html">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
<noscript><style>html.pre main > * { visibility: visible; }</style></noscript>
</head>
<body data-page="contact" data-async>
<div id="header-slot"></div>

<main id="main">
  <section class="section section--tight">
    <div class="container">
      <div class="sec-head">
        <p class="eyebrow" data-i18n="nav.contact"></p>
        <h1 class="sec-head__title" data-i18n="contact.title"></h1>
        <p class="sec-head__text" data-i18n="contact.lead"></p>
      </div>
      <!-- Contact cards: data/site.json → contact (only channels with a value are shown) -->
      <div class="grid grid--3" id="contact-cards"></div>
    </div>
  </section>

  <section class="section section--sand">
    <div class="container">
      <div class="grid grid--2">
        <div class="panel reveal">
          <div id="hours-panel" hidden>
            <h2 data-i18n="contact.hoursTitle"></h2>
            <ul class="hours" id="hours-list"></ul>
          </div>
          <div id="coverage-panel">
            <h2 data-i18n="contact.coverageTitle"></h2>
            <p class="muted" data-i18n="contact.coverageText"></p>
            <ul class="coverage" id="coverage-list"></ul>
          </div>
        </div>
        <div class="panel reveal" id="map-panel" hidden>
          <h2 data-i18n="contact.mapTitle"></h2>
          <p class="muted" id="address-line"></p>
          <div class="map-frame" id="map-frame" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="cta-band reveal">
        <h2 data-i18n="contact.formTitle"></h2>
        <p data-i18n="contact.formText"></p>
        <div class="btn-row">
          <a class="btn btn--sand" href="custom.html"><span data-i18n="contact.formCta"></span></a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-slot"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/info.js"></script>
</body>
</html>
